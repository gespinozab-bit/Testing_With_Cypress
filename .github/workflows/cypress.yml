name: Cypress E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/Cypress

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.17.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and verify Cypress binary
        run: |
          pnpm exec cypress install
          pnpm exec cypress verify

      - name: Build
        run: pnpm build

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: pnpm dev:test
          wait-on: 'http://localhost:5173, http://localhost:3000/api/products'
          browser: chrome
        env:
          DATABASE_PATH: data/cafe-ci.sqlite

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 7
